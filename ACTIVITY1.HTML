<html>
    <head>
        <title>my superhero card</title>
        <style>
            body {
                background-color: purple;
                background-image: linear-gradient(to right, blue,brown);
                color: aquamarine;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }
            .hero-name {
                font-size: 40px;
                font-weight: bolder;
                color: crimson;
                text-shadow: 3px 3px aliceblue;
            }
            .tagline { 
                font-style: oblique;
                color: beige;
                text-transform: capitalize ;
            }
            .label {
                text-transform: uppercase;
                text-decoration: underline;
                color: coral;
            }
            .power {
                font-weight: bold;
                color: yellowgreen;
            }
            .weakness {
                text-decoration: line-through;
                color:black ;
            }
            .badge {
                font-size: 30px;
                font-weight: bold;
                color: gold;
                transform: rotate(25deg);
            }
            .made-by {
                color: cyan;
                text-transform: capitalize;
                font-style: italic;
            }

        </style>
    </head>
    <body>
        <h1 class ="hero-name">thunder kid</h1>
        <p class="tagline">the most powerful hero in the school</p>
        <h2 class="label">super powers</h2>
        <p class="power">can run faster than a cheetah.</p>
        <p class="power"> can lift a school bus.</p>
        <h2 class="label">weakness</h2>
        <p class="weakness">maths homework</p>
        <p class="weakness"> brocoli</p>
        <p class="badge">hero he is</p>
        <p class="made-by">created by arnabi</p>
    </body>
</html>
