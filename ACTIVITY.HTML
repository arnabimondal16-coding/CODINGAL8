<html>
    <head>
        <style>
            body{
                background-color: purple;
                background-image: linear-gradient(to bottom, purple,chocolate);
                background-repeat: no-repeat;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;

            }
            .page-header{
                background-image: linear-gradient(to right,aqua,darkblue);
                border-radius: 16px;
                text-align: center;
                color: antiquewhite;

            }
            .fact-card {
                background-color: pink;
                border: 12px;
                color:brown
            }
            .fact-card h2 {
                color:black;
            }
            .star {
                width: 50px;
                height: 50px;
                background-color: yellow;
                border-radius: 50px;
                animation: twinkle 3s infinite alternate;
            }
            @keyframes twinkle {
                from {background-color: yellow;}
                to {background-color: orangered;}
            }
            .footer-text {
                text-align: center;
                color: yellowgreen;
            }
            
        </style>
    </head>
    <div class="page-header">
        <h1>MY SPACE PAGE</h1>
        <p> WELCOME TO THE CORNER OF MY GALAXY!</p>
    </div>
    <div class="fact-card">
        <h2>FUN SPACE FACT</h2>
        <p>THE SUN IS SO BIG THAT ONE MILLION EARTH COULD FIT IN IT</p>
    </div>
    <div class="star"></div>
    <p class="footer-text">MADE BY ARNABI</p>
</html>
